# Build the container image of the pipeline environment from pixi.lock and
# publish it to the GitHub Container Registry on every release tag.
# Check that the image has the same tool versions as the lock file.
name: Container

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "containers/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image from pixi.lock
        run: |
          docker build --platform linux/amd64 -f containers/Dockerfile \
            --build-arg ENV_NAME=pipeline -t amr-pipeline:ci .

      - name: Same tool versions in the image as in pixi.lock
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.85.0
          locked: true
          environments: pipeline
      - run: |
          docker run --rm amr-pipeline:ci spades.py --version | tee image.txt
          pixi run -e pipeline spades.py --version | tee host.txt
          diff image.txt host.txt

      - name: Push to ghcr.io (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag amr-pipeline:ci "$image:${GITHUB_REF_NAME}"
          docker tag amr-pipeline:ci "$image:latest"
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"
