[workspace]
channels = ["conda-forge", "bioconda"]
name = "snakemake_antibiotic_resistance"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "1.0.0"
description = "Assembly, annotation and antimicrobial resistance gene detection in Staphylococcus aureus isolates"

[tasks]
download = { cmd = "python scripts/download_data.py", description = "Download the raw data and verify checksums" }
verify-data = { cmd = "python scripts/download_data.py --verify-only", description = "Check the raw data without downloading" }
report = { cmd = "quarto render reports/amr-report.qmd", depends-on = ["check-results"], description = "Render the Quarto report (reports/amr-report.html)" }
reproduce = { depends-on = [{ task = "report" }], description = "Everything: data, workflow, checks, report" }

[dependencies]
python = "3.12.*"
quarto = ">=1.8"
jupyter = ">=1.1"
ipykernel = ">=6.29"
pandas = ">=2.2"
matplotlib = ">=3.9"
pyyaml = ">=6"
jinja2 = ">=3.1"

[feature.pipeline]
platforms = ["linux-64", "osx-64"]

[feature.pipeline.dependencies]
snakemake = ">=9.27,<10"
snakefmt = ">=0.10"
fastqc = "0.13.*"
spades = "4.0.*"
quast = "5.3.*"
prokka = "1.15.*"
abricate = "1.4.*"
setuptools = "<81"

[feature.pipeline.tasks]
run-snakemake = { cmd = "snakemake --cores 4", depends-on = ["download"], description = "Run the pipeline with Snakemake" }
lint = { cmd = "snakefmt --check workflow/Snakefile", description = "Check the Snakefile style" }
check-results = { cmd = "python scripts/check_results.py", depends-on = ["run-snakemake"], description = "Compare the main results with metadata/expected_results.tsv" }

[environments]
pipeline = ["pipeline"]
